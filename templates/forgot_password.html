{% extends "_auth_card.html" %}
{% block title %}Recuperar senha{% endblock %}
{% block content %}
  <h2>Recuperar senha</h2>
  {% if message %}
    <div class="auth-alert success">{{ message }}</div>
  {% else %}
    <p>Informe o e-mail da sua conta e enviaremos um link para criar uma nova senha.</p>
    <form action="/auth/recover-password" method="post">
      {{ csrf_input(request) }}
      <input type="email" name="email" placeholder="Seu e-mail" required>
      <button type="submit" class="btn-cta">Enviar link</button>
    </form>
  {% endif %}
{% endblock %}
