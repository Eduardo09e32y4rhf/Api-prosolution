<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}{% endblock %} | {{ company.app_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/login.css">
  <style>
    .legal { max-width: 820px; margin: 0 auto; padding: 48px 24px 80px; line-height: 1.7; color: #cbd5e1; }
    .legal h1 { color: #fff; font-size: 2rem; margin-bottom: 8px; }
    .legal h2 { color: #fff; font-size: 1.25rem; margin: 32px 0 10px; }
    .legal p, .legal li { margin-bottom: 10px; }
    .legal ul { padding-left: 22px; }
    .legal a { color: #a855f7; }
    .legal .updated { color: #94a3b8; font-size: 0.9rem; margin-bottom: 28px; }
    .legal table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.95rem; }
    .legal th, .legal td { border: 1px solid #374151; padding: 8px 10px; text-align: left; vertical-align: top; }
    .legal th { color: #fff; background: #111827; }
    .legal nav { margin-bottom: 32px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main class="legal">
    <nav>
      <a href="/">← Início</a>
      <a href="/termos">Termos de Uso</a>
      <a href="/privacidade">Política de Privacidade</a>
      <a href="/exclusao-de-dados">Exclusão de Dados</a>
    </nav>
    {% block content %}{% endblock %}
    <p class="updated" style="margin-top: 40px;">{{ company.name }} · CNPJ {{ company.document }} · {{ company.address }} · <a href="mailto:{{ company.contact_email }}">{{ company.contact_email }}</a></p>
  </main>
</body>
</html>
