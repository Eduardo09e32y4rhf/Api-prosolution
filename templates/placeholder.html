<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{{ title }} | Prosolution IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --bg-base: #090d16;
      --bg-surface: #111827;
      --bg-card: rgba(23, 32, 51, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #9333ea;
      --primary-hover: #a855f7;
      --accent: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
    .glow { position: fixed; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(147, 51, 234, 0.15), transparent 70%); top: -100px; right: -100px; pointer-events: none; }
    .dashboard-container { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; z-index: 1; position: relative; }
    .sidebar { background: rgba(17, 24, 39, 0.85); border-right: 1px solid var(--border); padding: 32px 24px; backdrop-filter: blur(16px); display: flex; flex-direction: column; }
    .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; display: flex; align-items: center; gap: 8px; }
    .logo span { background: linear-gradient(135deg, #a855f7, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .menu-list { display: flex; flex-direction: column; gap: 8px; }
    .menu-item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; color: var(--text-muted); text-decoration: none; border-radius: 12px; font-weight: 500; font-size: 0.95rem; border: 1px solid transparent; }
    .menu-item:hover, .menu-item.active { background: rgba(147, 51, 234, 0.12); color: var(--text-main); transform: translateX(4px); }
    .menu-item.active { background: linear-gradient(135deg, rgba(147, 51, 234, 0.2), rgba(6, 182, 212, 0.1)); color: #fff; font-weight: 600; }
    .menu-item i { font-size: 1.25rem; color: var(--primary-hover); }
    .main-content { padding: 40px 48px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div class="glow"></div>
<div class="dashboard-container">
    <aside class="sidebar">
        <div class="logo"><i class="ri-flashlight-line" style="color: var(--primary-hover);"></i><div>PRO<span>SOLUTION</span></div></div>
        <nav class="menu-list">
            <a href="/dashboard/" class="menu-item {% if active_menu == 'home' %}active{% endif %}"><i class="ri-dashboard-line"></i> Início</a>
            <a href="/dashboard/create" class="menu-item {% if active_menu == 'create' %}active{% endif %}"><i class="ri-edit-2-line"></i> Criar conteúdo</a>
            <a href="/dashboard/calendar" class="menu-item {% if active_menu == 'calendar' %}active{% endif %}"><i class="ri-calendar-event-line"></i> Calendário</a>
            <a href="/dashboard/instagram" class="menu-item {% if active_menu == 'instagram' %}active{% endif %}"><i class="ri-instagram-line"></i> Instagram</a>
            <a href="/dashboard/subscription" class="menu-item {% if active_menu == 'subscription' %}active{% endif %}"><i class="ri-vip-crown-line"></i> Minha assinatura</a>
            <a href="/dashboard/settings" class="menu-item {% if active_menu == 'settings' %}active{% endif %}"><i class="ri-settings-4-line"></i> Configurações</a>
            
            <form action="/auth/logout" method="post" style="margin-top: 20px;">
              <button type="submit" class="menu-item" style="width: 100%; background: transparent; cursor: pointer; text-align: left; color: #ef4444; border: none;"><i class="ri-logout-box-r-line"></i> Sair</button>
            </form>
        </nav>
    </aside>

    <main class="main-content">
        <i class="ri-tools-line" style="font-size: 4rem; color: var(--primary); margin-bottom: 20px;"></i>
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">{{ title }}</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; text-align: center; max-width: 500px;">Esta funcionalidade está sendo construída e estará disponível na V2 completa.</p>
    </main>
</div>
</body>
</html>
