{% extends "_auth_card.html" %}
{% block title %}Nova senha{% endblock %}
{% block content %}
  <h2>Criar nova senha</h2>
  {% if error %}
    <div class="auth-alert error">{{ error }}</div>
  {% endif %}
  {% if token %}
    <form action="/auth/reset-password" method="post">
      {{ csrf_input(request) }}
      <input type="hidden" name="token" value="{{ token }}">
      <input type="password" name="new_password" placeholder="Nova senha (mínimo 8 caracteres)" minlength="8" required>
      <button type="submit" class="btn-cta">Salvar nova senha</button>
    </form>
  {% else %}
    <p>Link inválido. <a href="/auth/recover-password" style="color: #a855f7;">Solicite uma nova recuperação</a>.</p>
  {% endif %}
{% endblock %}
