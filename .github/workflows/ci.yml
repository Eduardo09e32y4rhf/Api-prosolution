name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      # Chave Fernet fixa só para o CI (não é usada em nenhum ambiente real)
      ENCRYPTION_KEY: cHJvc29sdXRpb24tY2ktb25seS1mZXJuZXQta2V5ISE=
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Migrações (upgrade + modelos em sincronia)
        run: |
          alembic upgrade head
          alembic check

      - name: Testes
        run: pytest -q
