name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SECRET_KEY: ci-secret-key
  # Chave Fernet fixa só para o CI (não é usada em nenhum ambiente real)
  ENCRYPTION_KEY: cHJvc29sdXRpb24tY2ktb25seS1mZXJuZXQta2V5ISE=

jobs:
  checks:
    name: Lint, tipos e testes (SQLite)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Migrações (upgrade + modelos em sincronia)
        run: |
          alembic upgrade head
          alembic check

      - name: Testes
        run: pytest -q

  postgres:
    name: Migrações e testes (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prosolution
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/prosolution
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/prosolution
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências e cliente do Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          pg_dump --version
          pip install -r requirements-dev.txt

      - name: Migrações (ida, volta e ida)
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Testes (inclui concorrência do worker e backup real)
        run: pytest -q

  docker:
    name: Build da imagem e docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env
          docker compose config --quiet

      - name: Build da imagem
        run: docker build -t prosolution:ci .

      - name: A imagem sobe e responde no /health
        run: |
          docker run -d --name app -p 3000:3000 \
            -e SECRET_KEY -e ENCRYPTION_KEY \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db \
            prosolution:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
